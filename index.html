<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Сайт: Расписания и Турниры</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Dota 2 Киберспорт & Мета</h1>
        <!-- Навигационные кнопки вкладок -->
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('news')">Главная / Стрим</button>
            <button class="tab-btn" onclick="switchTab('analytics')">Аналитика</button>
            <button class="tab-btn" onclick="switchTab('rating')">Рейтинг EPT</button>
            <button class="tab-btn" onclick="switchTab('teams')">Команды</button>
            <button class="tab-btn" onclick="switchTab('meta')">Мета героев</button>
            <button class="tab-btn" onclick="switchTab('forum')">Форум</button>
            <button class="tab-btn" onclick="switchTab('archive')">Архив TI</button>
            <button class="tab-btn" onclick="switchTab('bracket')">Сетка</button>
        </nav>
    </header>

    <main class="container">
        <section id="news" class="tab-content active-content">
          <div id="news-container"></div>
        </section>

        <section id="analytics" class="tab-content">
            <h2>Аналитика матчей</h2>
            <div id="analytics-container"></div>
        </section>

        <section id="rating" class="tab-content">
            <h2>Рейтинг команд EPT</h2>
            <div id="rating-container"></div>
        </section>

        <section id="teams" class="tab-content">
            <h2>Профессиональные команды</h2>
            <div id="teams-container"></div>
        </section>

        <section id="meta" class="tab-content">
            <h2>Мета героев и сборки</h2>
        </section>

        <!-- Форум -->
        <section id="forum" class="tab-content">
          <h2>Форум сообщества</h2>

          <div id="forum-auth" style="margin-bottom:12px;">
            <button id="btn-login">Войти через Google</button>
            <button id="btn-logout" style="display:none;">Выйти</button>
            <span id="user-info" style="margin-left:10px;color:#9ca3af;"></span>
          </div>

          <div id="new-thread" style="margin-bottom:18px;">
            <input id="thread-title" placeholder="Заголовок темы" style="width:60%;padding:8px;" />
            <input id="thread-tags" placeholder="Теги (через запятую)" style="width:20%;padding:8px;margin-left:8px;" />
            <button id="btn-create-thread">Создать тему</button>
            <div><textarea id="thread-body" placeholder="Текст темы" style="width:100%;height:90px;margin-top:8px;padding:8px;"></textarea></div>
          </div>

          <div style="display:flex;gap:20px;">
            <div style="flex:1;">
              <h3>Темы</h3>
              <div id="forum-threads" style="display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto;"></div>
            </div>

            <div style="flex:1;">
              <h3>Просмотр темы</h3>
              <div id="thread-view" style="background:#07121a;padding:12px;border-radius:8px;min-height:300px;"></div>
            </div>
          </div>
        </section>

        <section id="archive" class="tab-content">
            <h2>Архив турниров The International</h2>
            <div id="archive-container"></div>
        </section>

        <section id="bracket" class="tab-content">
            <h2>Турнирная сетка</h2>
            <div id="bracket-container"></div>
        </section>
    </main>

    <!-- Модальное окно -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('modal').style.display='none'">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
